# Litestream 0.5.x config for an S3-compatible bucket (Backblaze B2, Cloudflare R2, MinIO, ...).
# Every ${VAR} is expanded from the environment at startup, so no secret is ever in the image.
#
# Required:  LITESTREAM_BUCKET, LITESTREAM_ACCESS_KEY_ID, LITESTREAM_SECRET_ACCESS_KEY
# Provider:  LITESTREAM_ENDPOINT (e.g. s3.us-west-004.backblazeb2.com), LITESTREAM_REGION
# Optional:  LITESTREAM_PATH (folder inside the bucket), LITESTREAM_FORCE_PATH_STYLE (true for MinIO)

# On shutdown Litestream does one last sync. Render waits 30 s before SIGKILL by
# default, and this wait must finish INSIDE that window, so it is set lower.
shutdown-sync-timeout: 20s

# BACKGROUND TIMERS - the reason this file is tuned.
# Every timer below lists the bucket each time it fires. With Litestream's defaults
# (L0 retention check every 15 s, compaction every 30 s / 5 m / 1 h) an idle,
# awake service made about 650 LIST requests an hour (measured, 15 minutes against
# an S3-compatible server). Backblaze B2's free tier allows 2,500 "Class C" requests
# a day, LIST included: the cap was hit, B2 answered 403 to everything (including the
# restore at startup) and the service could not boot. These values cut the idle rate
# to about 30 an hour (measured, same test) and restored the same data.
# Trade-off: compaction and cleanup of old files are slower; backups, restore and
# the 1-2 s replication lag are unchanged.
# These are LITERAL values, not ${ENV} references, on purpose: a restore run by hand
# during an outage (no entrypoint, no exported variables) must still parse this file.
levels:
  - interval: 10m     # Litestream default: 30s
  - interval: 1h      # Litestream default: 5m, plus a third level at 1h
l0-retention: 30m                 # Litestream default: 5m
l0-retention-check-interval: 10m  # Litestream default: 15s

dbs:
  - path: ${CODEMAP_DB_PATH}
    replica:
      type: s3
      bucket: ${LITESTREAM_BUCKET}
      path: ${LITESTREAM_PATH}
      endpoint: ${LITESTREAM_ENDPOINT}
      region: ${LITESTREAM_REGION}
      access-key-id: ${LITESTREAM_ACCESS_KEY_ID}
      secret-access-key: ${LITESTREAM_SECRET_ACCESS_KEY}
      force-path-style: ${LITESTREAM_FORCE_PATH_STYLE}
      sync-interval: 1s
      # Small buffers: this container shares 512 MB with Python and Node.
      # BYTES, not "5MB": Litestream reads "5MB" as 5,000,000, which is below S3's
      # 5 MiB (5,242,880) minimum, so EVERY upload failed while the app kept running
      # happily with no backup at all (found by running this config against an
      # S3-compatible server). Backblaze B2's minimum (5 MB) is satisfied too.
      part-size: 5242880
      concurrency: 2
