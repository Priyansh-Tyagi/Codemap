name: 'CodeMap Dependency Check'
description: >
  Analyzes a JavaScript/TypeScript repository for circular dependencies and
  high-risk files using CodeMap's static analysis engine, and optionally
  gates a PR on the result.
author: 'CodeMap'

inputs:
  path:
    description: 'Path (relative to the repo root) to analyze'
    required: false
    default: '.'
  risk-threshold:
    description: >
      Fail if any file's risk score is at or above this value (0-100).
      Leave empty to disable this check.
    required: false
    default: ''
  fail-on-new-cycle:
    description: >
      Fail if a circular dependency is found that is not present in the
      baseline file. Requires "baseline" to be set to be meaningful - if
      no baseline is given, every existing cycle counts as "new".
    required: false
    default: 'false'
  baseline:
    description: >
      Path to a baseline JSON file (generated by a previous run's
      "output", typically checked into the repo from a run against the
      default branch) to compare cycles against.
    required: false
    default: ''
  comment-on-pr:
    description: 'Post the analysis result as a comment on the pull request'
    required: false
    default: 'true'

outputs:
  passed:
    description: 'Whether the check passed ("true"/"false")'
    value: ${{ steps.analyze.outputs.passed }}

runs:
  using: 'composite'
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Set up Node
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install CodeMap dependencies
      shell: bash
      run: |
        pip install -r "${{ github.action_path }}/backend/requirements.txt"
        cd "${{ github.action_path }}/backend/parser" && npm install --no-fund --no-audit

    - name: Run CodeMap analysis
      id: analyze
      shell: bash
      run: |
        cd "${{ github.action_path }}/backend/app"

        ARGS=(analyze "${{ github.workspace }}/${{ inputs.path }}" --format markdown --output "${{ github.workspace }}/codemap-result.json")

        if [ -n "${{ inputs.risk-threshold }}" ]; then
          ARGS+=(--risk-threshold "${{ inputs.risk-threshold }}")
        fi
        if [ "${{ inputs.fail-on-new-cycle }}" = "true" ]; then
          ARGS+=(--fail-on-new-cycle)
        fi
        if [ -n "${{ inputs.baseline }}" ]; then
          ARGS+=(--baseline "${{ github.workspace }}/${{ inputs.baseline }}")
        fi

        set +e
        python cli.py "${ARGS[@]}" > "${{ github.workspace }}/codemap-comment.md"
        EXIT_CODE=$?
        set -e

        cat "${{ github.workspace }}/codemap-comment.md"

        if [ $EXIT_CODE -eq 0 ]; then
          echo "passed=true" >> "$GITHUB_OUTPUT"
        else
          echo "passed=false" >> "$GITHUB_OUTPUT"
        fi
        exit $EXIT_CODE

    - name: Comment on pull request
      if: always() && inputs.comment-on-pr == 'true' && github.event_name == 'pull_request'
      uses: actions/github-script@v7
      with:
        script: |
          const fs = require('fs');
          const path = require('path');
          const commentPath = path.join(process.env.GITHUB_WORKSPACE, 'codemap-comment.md');
          const body = fs.readFileSync(commentPath, 'utf-8');

          // Look for a previous CodeMap comment on this PR and update it in
          // place, rather than piling up a new comment on every push.
          const marker = '### CodeMap Analysis';
          const { data: comments } = await github.rest.issues.listComments({
            owner: context.repo.owner,
            repo: context.repo.repo,
            issue_number: context.issue.number,
          });
          const existing = comments.find((c) => c.body.includes(marker));

          if (existing) {
            await github.rest.issues.updateComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: existing.id,
              body,
            });
          } else {
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });
          }
