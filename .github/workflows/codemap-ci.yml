name: CodeMap Check

# Self-contained demonstration of the CodeMap Action, running against the
# bundled examples/demo-repo (see action.yml at the repo root). Points
# "uses: ./" at this same repo's action.yml rather than a published,
# versioned Action - fine for demonstrating the pattern within this repo;
# see the README for how another repository would reference this Action
# once it's published/tagged.

"on":
  pull_request:
    paths:
      - "examples/demo-repo/**"
  workflow_dispatch: {} # allows manually triggering a run from the Actions tab

# Least privilege: nothing is writable unless a job asks for it below.
permissions:
  contents: read

jobs:
  codemap-check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write # needed for the PR-comment step in action.yml
    steps:
      # SHA-pinned (see action.yml for why); no credentials left in .git for later steps.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Run CodeMap check
        uses: ./
        with:
          path: examples/demo-repo
          risk-threshold: '80'
          fail-on-new-cycle: 'true'
          baseline: examples/demo-repo-baseline.json
