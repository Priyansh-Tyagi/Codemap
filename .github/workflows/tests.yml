name: Tests

# Runs the real test suites on every pull request and on pushes to main, so a
# dependency bump (Dependabot) or a code change gets a pass/fail signal.
# The "CodeMap Check" workflow only exercises the Action on the demo repo; it
# does NOT run these suites.

"on":
  pull_request: {}
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      # SHA-pinned, same pins as action.yml; Dependabot keeps them fresh.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'   # same major as the Docker image

      - name: Install parser dependencies
        working-directory: backend/parser
        run: npm ci

      # The same hash-locked file the Docker image installs (Linux), so CI tests
      # what actually ships. requirements.txt is NOT what production runs.
      - name: Install Python dependencies (hash-locked)
        working-directory: backend
        run: pip install --require-hashes -r requirements.lock

      - name: Backend tests
        working-directory: backend
        run: python -m pytest tests -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - name: Install
        working-directory: frontend
        run: npm ci
      - name: Frontend tests
        working-directory: frontend
        run: npm test
      - name: Production build
        working-directory: frontend
        run: npm run build
