name: Tests

# Runs the real test suites on every pull request and on pushes to main, so a
# dependency bump (Dependabot) or a code change gets a pass/fail signal.
# The "CodeMap Check" workflow only exercises the Action on the demo repo; it
# does NOT run these suites.

"on":
  pull_request: {}
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      # SHA-pinned, same pins as action.yml; Dependabot keeps them fresh.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'   # same major as the Docker image

      - name: Install parser dependencies
        working-directory: backend/parser
        run: npm ci

      # The same hash-locked file the Docker image installs (Linux), so CI tests
      # what actually ships. requirements.txt is NOT what production runs.
      - name: Install Python dependencies (hash-locked)
        working-directory: backend
        run: pip install --require-hashes -r requirements.lock

      - name: Backend tests
        working-directory: backend
        run: python -m pytest tests -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      - name: Install
        working-directory: frontend
        run: npm ci
      - name: Frontend tests
        working-directory: frontend
        run: npm test
      - name: Production build
        working-directory: frontend
        run: npm run build
