# Render blueprint for the CodeMap backend. NOT yet tested on a real Render
# account - verify before relying on it. The disk is what keeps saved
# projects and shared links alive across redeploys; it requires a paid plan
# and pins the service to a single instance (SQLite is single-writer).
services:
  - type: web
    name: codemap-api
    runtime: python
    plan: starter
    rootDir: backend
    # requirements.lock = exact versions + hashes, so only reviewed artifacts install;
    # `npm ci` installs exactly package-lock.json (plain `npm install` can drift).
    buildCommand: pip install --require-hashes -r requirements.lock && cd parser && npm ci
    # --workers 1: SQLite is single-writer and the rate limiter is in-memory.
    # --proxy-headers/--forwarded-allow-ips: behind Render's proxy every request
    # arrives from the proxy's address; without this the per-client rate limits
    # would treat ALL visitors as one client. '*' is acceptable here only because
    # the service is reachable solely through Render's proxy - on a host where the
    # port is directly exposed, list the proxy's address instead.
    startCommand: cd app && uvicorn main:app --host 0.0.0.0 --port $PORT --workers 1 --proxy-headers --forwarded-allow-ips='*'
    disk:
      name: codemap-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8   # the version the lockfile and test suite were verified on
      # Never expose "analyze a folder on the server" publicly: it would let any
      # visitor map the server's own filesystem. Off is also the default; stated
      # here so nobody has to wonder.
      - key: CODEMAP_ALLOW_LOCAL_PATHS
        value: "false"
      - key: CODEMAP_DISABLE_DOCS
        value: "true"   # hides /docs, /redoc and /openapi.json
      - key: CODEMAP_ALLOWED_HOSTS
        sync: false     # set to your API hostname, e.g. codemap-api.onrender.com
      - key: CODEMAP_GITHUB_REDIRECT_URI
        sync: false     # only if offering sign-in: https://<your-api>/api/auth/github/callback
      - key: CODEMAP_DB_PATH
        value: /var/data/codemap.db
      - key: CODEMAP_ALLOWED_ORIGINS
        sync: false   # set to your deployed frontend URL
      - key: GITHUB_TOKEN
        # Optional (raises anonymous visitors' limit 60/hr -> 5,000/hr), but treat it as
        # PUBLIC data only: use a fine-grained token with read access to public repos and
        # NOTHING else, never a classic token with the `repo` scope. Private repos are also
        # refused in code when only this shared token is in play, but least privilege is the
        # real protection.
        sync: false
      - key: CODEMAP_FRONTEND_URL
        sync: false   # only if offering GitHub sign-in - your deployed frontend's URL
      - key: CODEMAP_GITHUB_CLIENT_ID
        sync: false   # only if offering GitHub sign-in
      - key: CODEMAP_GITHUB_CLIENT_SECRET
        sync: false   # only if offering GitHub sign-in
      - key: CODEMAP_SECRET_KEY
        sync: false   # only if offering GitHub sign-in - generate with:
                       # python -c "from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())"
      - key: CODEMAP_COOKIE_SECURE
        value: "true" # required once frontend/backend are on different domains (the normal case here)
      - key: GEMINI_API_KEY
        sync: false   # optional - offers AI narration for the guided tour
