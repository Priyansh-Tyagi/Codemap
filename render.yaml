# Render blueprint for the CodeMap backend on the FREE plan, using Docker + Litestream.
# NOT yet deployed to a real Render account - verify each setting in the dashboard.
#
# Free web services have an EPHEMERAL filesystem (wiped on every redeploy, restart and
# idle spin-down) and cannot attach a disk, so SQLite alone would lose every saved
# project. Litestream (inside the image) streams the database to an S3-compatible
# bucket and restores it on boot. See README "Deployment: free tier + Litestream".
services:
  - type: web
    name: codemap-api
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /api/health
    # IMPORTANT - keep this false. During an automatic deploy the old and new instances
    # run side by side and both replicate to ONE bucket path; measured here: the OLD
    # instance's writes in that window are silently dropped (the backup stays valid).
    # Deploy by hand, when nobody is likely to be saving a project.
    autoDeployTrigger: "off"   # older blueprints call this `autoDeploy: false`; confirm in Settings > Build & Deploy
    envVars:
      # --- replication (see backend/docker/litestream.yml) ---
      # Replication on. If the bucket provider refuses requests (e.g. B2's free daily cap),
      # the app now starts DEGRADED on its own: no replication, bucket untouched, banner in
      # the UI. Set this to "false" only to switch backups off on purpose.
      - key: LITESTREAM_ENABLED
        value: "true"
      - key: LITESTREAM_BUCKET
        sync: false     # your bucket name
      - key: LITESTREAM_ENDPOINT
        sync: false     # full URL, e.g. https://s3.us-west-004.backblazeb2.com
      - key: LITESTREAM_REGION
        sync: false     # B2 example: us-west-004
      - key: LITESTREAM_ACCESS_KEY_ID
        sync: false     # an application key limited to THIS bucket only
      - key: LITESTREAM_SECRET_ACCESS_KEY
        sync: false
      # A FRESH folder for production, so nothing from local test runs can ever be
      # restored into the live database. (Local tests used "codemap".)
      - key: LITESTREAM_PATH
        value: prod
      - key: LITESTREAM_FORCE_PATH_STYLE
        value: "true"   # Backblaze B2 accepts path-style URLs; safe default
      # --- app ---
      - key: CODEMAP_DB_PATH
        value: /data/codemap.db
      # 512 MB is shared by Python, Litestream and the Node parser; keep Node's heap small
      # so a huge repo fails cleanly instead of OOM-killing the container mid-backup.
      - key: CODEMAP_PARSER_MAX_HEAP_MB
        value: "192"
      # Fewer saved projects = a smaller database to download on every cold start.
      - key: CODEMAP_MAX_PROJECTS
        value: "300"
      - key: CODEMAP_ALLOW_LOCAL_PATHS
        value: "false"
      - key: CODEMAP_DISABLE_DOCS
        value: "true"
      - key: CODEMAP_ALLOWED_HOSTS
        sync: false     # your API hostname only, e.g. codemap-api.onrender.com. /api/health is exempt from this check (platform health checkers use a private Host), every other path is enforced.
      - key: CODEMAP_ALLOWED_ORIGINS
        sync: false     # your deployed frontend URL, exactly
      - key: CODEMAP_COOKIE_SECURE
        value: "true"
      # MUST be set (and never changed): it encrypts stored GitHub tokens. If it is unset the
      # key is random per start, so every restored database holds tokens nobody can decrypt.
      - key: CODEMAP_SECRET_KEY
        sync: false     # python -c "from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())"
      - key: CODEMAP_FRONTEND_URL
        sync: false     # only if offering GitHub sign-in
      - key: CODEMAP_GITHUB_REDIRECT_URI
        sync: false     # https://<your-api>/api/auth/github/callback
      - key: CODEMAP_GITHUB_CLIENT_ID
        sync: false
      - key: CODEMAP_GITHUB_CLIENT_SECRET
        sync: false
      - key: GITHUB_TOKEN
        sync: false     # optional; fine-grained, PUBLIC-repo read only
      - key: GEMINI_API_KEY
        sync: false     # optional
